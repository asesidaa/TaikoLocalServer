name: TLS GitHub Actions
run-name: Publish TLS executable program 🚀

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # required for `gh release create`

env:
  Major_Version_Number: '1'
  Minor_Version_Number: '2'
  Build_Number: ${{ github.run_number }}

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore Host/Host.csproj

      # Self-contained + single-file + native-libs-bundled are configured in
      # Host/Host.csproj under the `Configuration != Debug` PropertyGroup.
      # We do NOT pass -p:PublishSingleFile=true on the CLI because it would
      # propagate to TaikoWebUI (a Blazor WASM project) and break its publish.
      #
      # Retry guards against intermittent wasm-ld file-lock failures on
      # Windows runners (see run 25282588630).
      - name: Publish (Release, win-x64, self-contained)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 1; $i -le 3; $i++) {
            try {
              dotnet publish Host/Host.csproj -c Release -r win-x64 --self-contained true --nologo
              if ($LASTEXITCODE -eq 0) { break }
              throw "publish exited $LASTEXITCODE"
            } catch {
              if ($i -eq 3) { throw }
              Write-Host "::warning::publish attempt $i failed; retrying in 10s"
              Start-Sleep -Seconds 10
            }
          }

      - name: Locate publish output
        id: locate
        shell: pwsh
        run: |
          $path = "Host/bin/Release/net10.0/win-x64/publish"
          if (-not (Test-Path $path)) { throw "publish dir missing: $path" }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=TLS-${{ env.Major_Version_Number }}.${{ env.Minor_Version_Number }}.${{ env.Build_Number }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        # Build/publish runs on every branch (catches breakage early); the
        # 90-day-retention artifact is only uploaded for dev pushes.
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.locate.outputs.name }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true

      # ---- Nightly release (dev pushes only) ---------------------------------
      # Reuses the publish output from the same job — no rebuild.
      # Deduped to one release per UTC day; same-day pushes overwrite.

      - name: Decide nightly release tag and skip-condition
        id: nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $tag   = "nightly-$today"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # `gh release view` exits 1 when the release doesn't exist; treat
          # that as "no existing release" instead of failing the step.
          $json = gh release view $tag --json targetCommitish,tagName 2>$null
          $global:LASTEXITCODE = 0
          $existing = if ($json) { $json | ConvertFrom-Json } else { $null }

          if ($existing -and $existing.targetCommitish -eq '${{ github.sha }}') {
            Write-Host "Today's nightly already points at this commit; nothing to do."
            "skip=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          exit 0

      - name: Zip publish output for release
        id: zip
        if: steps.nightly.outputs.skip == 'false'
        shell: pwsh
        run: |
          $tag = "${{ steps.nightly.outputs.tag }}"
          $zip = "TaikoLocalServer-$tag-win-x64.zip"
          Compress-Archive -Path "${{ steps.locate.outputs.path }}/*" -DestinationPath $zip
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create or update nightly release
        if: steps.nightly.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag   = "${{ steps.nightly.outputs.tag }}"
          $zip   = "${{ steps.zip.outputs.zip }}"
          $title = "Nightly $tag"
          $body  = "Automated build of ``dev`` at ${{ github.sha }}.`nNot a stable release."

          # Replace if the same-date release already exists for an older commit.
          # `gh release delete` exits 1 when the release doesn't exist; that's fine.
          gh release delete $tag --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0

          gh release create $tag $zip --title $title --notes $body --prerelease --target ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit $LASTEXITCODE" }
