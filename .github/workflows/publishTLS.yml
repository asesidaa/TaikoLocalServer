name: TLS GitHub Actions
run-name: Publish TLS executable program 🚀

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # required for `gh release create`

env:
  Major_Version_Number: '1'
  Minor_Version_Number: '2'
  Build_Number: ${{ github.run_number }}

jobs:
  # One build per platform: the server (self-contained, single file) with extract next to it, packed as the release
  # archive. Linux uses tar.gz, which keeps the executable bits (zip and the artifact store don't).
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            extract: extract.exe
            archive: TaikoLocalServer-win-x64.zip
          - rid: linux-x64
            os: ubuntu-latest
            extract: extract
            archive: TaikoLocalServer-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Self-contained + single-file + native-libs-bundled are configured in
      # Host/Host.csproj under the `Configuration != Debug` PropertyGroup.
      # We do NOT pass -p:PublishSingleFile=true on the CLI because it would
      # propagate to TaikoWebUI (a Blazor WASM project) and break its publish.
      #
      # Retry guards against intermittent wasm-ld file-lock failures on
      # Windows runners (see run 25282588630).
      - name: Publish (Release, ${{ matrix.rid }}, self-contained)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 1; $i -le 3; $i++) {
            try {
              dotnet publish Host/Host.csproj -c Release -r ${{ matrix.rid }} --self-contained true --nologo
              if ($LASTEXITCODE -eq 0) { break }
              throw "publish exited $LASTEXITCODE"
            } catch {
              if ($i -eq 3) { throw }
              Write-Host "::warning::publish attempt $i failed; retrying in 10s"
              Start-Sleep -Seconds 10
            }
          }

      # Both runner images ship a Rust toolchain. extract goes next to the server's
      # executable so its default --out (<exe dir>/wwwroot) is right.
      - name: Build and test extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --release --locked --manifest-path tools/extract/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo test exited $LASTEXITCODE" }
          cargo build --release --locked --manifest-path tools/extract/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo build exited $LASTEXITCODE" }

      - name: Locate publish output
        id: locate
        shell: pwsh
        run: |
          $path = "Host/bin/Release/net10.0/${{ matrix.rid }}/publish"
          if (-not (Test-Path $path)) { throw "publish dir missing: $path" }
          Copy-Item tools/extract/target/release/${{ matrix.extract }} $path
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=TLS-${{ env.Major_Version_Number }}.${{ env.Minor_Version_Number }}.${{ env.Build_Number }}-${{ matrix.rid }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ steps.locate.outputs.path }}/*" -DestinationPath ${{ matrix.archive }}

      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x "${{ steps.locate.outputs.path }}/TaikoLocalServer" "${{ steps.locate.outputs.path }}/extract"
          tar -czf ${{ matrix.archive }} -C "${{ steps.locate.outputs.path }}" .

      # Build/publish runs on every branch (catches breakage early); the
      # 90-day-retention artifact is only uploaded for dev pushes, where the
      # nightly release below picks it up.
      - name: Upload build artifact
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.locate.outputs.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ---- Nightly release (dev pushes only) -------------------------------------
  # Reuses both platforms' archives from the publish job — no rebuild.
  # Deduped to one release per UTC day; same-day pushes overwrite.
  nightly:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Decide nightly release tag and skip-condition
        id: nightly
        shell: pwsh
        run: |
          $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $tag   = "nightly-$today"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # `gh release view` exits 1 when the release doesn't exist; treat
          # that as "no existing release" instead of failing the step.
          $json = gh release view $tag --json targetCommitish,tagName 2>$null
          $global:LASTEXITCODE = 0
          $existing = if ($json) { $json | ConvertFrom-Json } else { $null }

          if ($existing -and $existing.targetCommitish -eq '${{ github.sha }}') {
            Write-Host "Today's nightly already points at this commit; nothing to do."
            "skip=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          exit 0

      - name: Download both platforms' archives
        if: steps.nightly.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true

      - name: Create or update nightly release
        if: steps.nightly.outputs.skip == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag   = "${{ steps.nightly.outputs.tag }}"
          $title = "Nightly $tag"
          $body  = "Automated build of ``dev`` at ${{ github.sha }}.`nNot a stable release."

          # The release's file names carry the tag: TaikoLocalServer-<tag>-<platform>.<ext>.
          $files = @(
            (Rename-Item archives/TaikoLocalServer-win-x64.zip "TaikoLocalServer-$tag-win-x64.zip" -PassThru).FullName,
            (Rename-Item archives/TaikoLocalServer-linux-x64.tar.gz "TaikoLocalServer-$tag-linux-x64.tar.gz" -PassThru).FullName
          )

          # Replace if the same-date release already exists for an older commit.
          # `gh release delete` exits 1 when the release doesn't exist; that's fine.
          gh release delete $tag --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0

          gh release create $tag @files --title $title --notes $body --prerelease --target ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit $LASTEXITCODE" }
