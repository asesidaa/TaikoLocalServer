<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaikoWebUI</title>
    <base href="/" />
    <!-- Applies dark mode + accent before first paint (no flash), and defines the JS the app calls. -->
    <script src="js/ui.js"></script>
    <link href="css/app.css" rel="stylesheet" />
</head>

<body class="bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
<div id="app">
    <div class="loader-container">
        <div class="loader-bar"></div>
        <span>Loading…</span>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <a class="dismiss">✕</a>
</div>
<script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
