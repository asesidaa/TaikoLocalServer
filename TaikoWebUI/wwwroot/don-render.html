<!doctype html>
<!-- don-chan alone, for the server's avatar renderer (Infrastructure/Avatars/HeadlessAvatarRenderer.cs): the costume comes
     from the query (as don-viewer.js's set() takes it), and window.don is the viewer (status, snapshot). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>don-chan</title>
  <script type="importmap">{ "imports": { "three": "./lib/three/three.module.min.js" } }</script>
  <style>html, body, #don { margin: 0; height: 100%; background: transparent; overflow: hidden; } #don { position: relative; }</style>
</head>
<body>
  <div id="don"></div>
  <script type="module">
    import { mount } from "./js/don-viewer.js";
    const state = {};
    for (const [k, v] of new URLSearchParams(location.search)) state[k] = k === "anim" || k === "cosFile" || k === "quality" ? v : Number(v);
    window.don = mount(document.getElementById("don"));
    window.don.set(state);
  </script>
</body>
</html>
